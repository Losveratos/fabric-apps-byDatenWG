id: datenwg-dwg-guv
name: datenwg-dwg-guv
version: 1.0.0
services:
  connectors:
    enabled: true
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: guv
    type: fabric-semanticmodel
    config:
      workspaceId: "<your-workspace-id>"
      itemId: "<your-semantic-model-id>"
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
